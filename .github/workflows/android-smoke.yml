# Prova e APK-së në Android virtual: instalimi, hapja, seanca dhe timer-i me ekran të kyçur,
# butoni mbrapa, tema, dhe përditësimi v1 -> v2 pa humbur të dhënat. Nuk ka nevojë për secret-et:
# përdor dy build-e debug me të njëjtin çelës debug. Skripti: scripts/android-smoke.mjs.
name: Prova e Android-it

# v2 (SPEC §0.1): prova në emulator bëhet në fund të etapës (versioni i ri te package.json) dhe kur
# ndryshon pjesa native, jo në çdo ndryshim të kodit web; testet, lint-i dhe build-i mbeten te CI.
# Me dorë: Actions → Prova e Android-it → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'scripts/android-smoke.mjs'
      - '.github/workflows/android-smoke.yml'

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # API 35: nga cepi në cep i detyrueshëm si në telefonat e rinj, dhe më i qëndrueshëm se 36 në runner-at me 2 bërthama.
  SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase i imituar: build-i i provës nuk flet kurrë me projektin e vërtetë.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://smoke.invalid
      - run: npx cap sync android

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dy versione debug me të njëjtin çelës
        run: |
          (cd android && ./gradlew --no-daemon assembleDebug)
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/v1.apk
          npm version patch --no-git-tag-version
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/v2.apk

      - name: Aktivizo KVM dhe liro hapësirë
        run: |
          # Mjetet e parainstaluara që prova nuk i përdor (.NET, Haskell, Boost) zënë rreth 10 GB.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h / | tail -1
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Nis emulatorin
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          # avdmanager dhe emulatori duhet të kërkojnë AVD-në në të njëjtën dosje.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
          "$tools/sdkmanager" --install emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          echo no | "$tools/avdmanager" create avd --force -n th -k "$SYSTEM_IMAGE" -d pixel_6 \
            -p "$ANDROID_AVD_HOME/th.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx th
          # Pixel 6 kërkon 6 GB për të dhënat; runner-i ka rreth 7 GB të lirë. 2 GB mjaftojnë për provën.
          # Rreshti ekzistues zëvendësohet (dy rreshta me të njëjtin çelës nuk lexohen njësoj çdo herë).
          config="$ANDROID_AVD_HOME/th.avd/config.ini"
          sed -i '/^disk\.dataPartition\.size=/d' "$config"
          echo "disk.dataPartition.size=2G" >> "$config"
          grep -n "dataPartition" "$config"
          nohup "$ANDROID_HOME/emulator/emulator" -avd th -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -camera-back none > emulator.log 2>&1 &
          # Çdo pritje ka afat, që një emulator që s'nis të mos e mbajë punën deri në fund të kohës.
          if ! timeout 300 adb wait-for-device \
            || ! timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then
            echo "::error title=Emulatori nuk nisi::Shih emulator.log në artifact."
            tail -50 emulator.log
            exit 1
          fi
          # Sistemi vazhdon të ngarkohet pas boot_completed; pritet animacioni i nisjes
          # dhe pak kohë që dritaret "isn't responding" të mos ndërhyjnë në provë.
          timeout 120 bash -c 'until [ "$(adb shell getprop init.svc.bootanim | tr -d "\r")" = "stopped" ]; do sleep 2; done' || true
          # Shërbimet e sistemit (settings, package) gati, pastaj pak qetësi para provës.
          timeout 300 bash -c 'until adb shell settings get global device_provisioned 2>/dev/null | grep -q 1 \
            && adb shell pm path android > /dev/null 2>&1; do sleep 5; done'
          sleep 30
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$setting" 0 || true
          done
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true

      - name: Prova
        run: node scripts/android-smoke.mjs smoke-out apks/v1.apk apks/v2.apk

      - name: Logcat dhe pamja e ekranit për diagnozë
        if: always()
        run: |
          mkdir -p smoke-out
          adb logcat -d > smoke-out/logcat.txt 2>&1 || true
          adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1 && adb shell cat /sdcard/ui.xml > smoke-out/ui.xml || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-smoke
          path: |
            smoke-out/
            emulator.log
          retention-days: 14
