# APK-ja e nënshkruar për Android.
# - Push te main me një version të ri te package.json: krijon vetë tag-un vX.Y.Z dhe
#   GitHub Release-in me APK-në (vendim i 07.11.2026: pa hap me dorë për çdo version).
#   Nëse versioni ka tashmë Release, nuk ndërtohet asgjë.
# - Tag vX.Y.Z i krijuar me dorë (i njëjtë me package.json): e njëjta gjë.
# - "Run workflow" me dorë: ndërton dhe e lë si artifact, pa Release.
# - Para publikimit: prova në emulator (android-smoke.yml); kur dështon, Release-i nuk krijohet.
# Udhëzimi për secret-et dhe instalimin: docs/INSTALL.md.
name: APK për Android

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/android-release.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # Gjurma SHA-256 e certifikatës së çelësit të vetëm të nënshkrimit. Nëse secret-et
  # zëvendësohen me një çelës tjetër, ndërtimi ndalet: me çelës tjetër telefoni
  # nuk e instalon përditësimin mbi app-in ekzistues.
  TH_SIGNING_CERT_SHA256: 90a2fe2d4daed0e5c512704789217fd3642b0c136068406ecd01c0d801343b89

jobs:
  # Vendos nëse ka diçka për të bërë: një push te main pa version të ri nuk ndërton asgjë.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versioni dhe Release-i
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          build=true
          publish=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag-u $GITHUB_REF_NAME nuk përputhet me versionin v$version te package.json."
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Versioni $version ka tashmë Release: asgjë për të ndërtuar."
              build=false
            else
              publish=true
            fi
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  # Prova në emulator para çdo publikimi (android-smoke.yml: v1 → ky version, seanca, njoftimi, kamera, muzika,
  # instalimi i ri): një version i ri nuk del pa të. Ndërtimi me dorë, pa Release, nuk e pret.
  smoke:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android-smoke.yml

  apk:
    needs: [plan, smoke]
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia dhe tag-et, për shënimet "Çfarë ka të re" të përditësimit brenda app-it.
          fetch-depth: 0

      - name: Kontrollo secret-et e nënshkrimit
        env:
          TH_KEYSTORE_BASE64: ${{ secrets.TH_KEYSTORE_BASE64 }}
          TH_KEYSTORE_PASSWORD: ${{ secrets.TH_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TH_KEYSTORE_BASE64" ] || [ -z "$TH_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Mungon çelësi i nënshkrimit::Shto secret-et TH_KEYSTORE_BASE64 dhe TH_KEYSTORE_PASSWORD sipas docs/INSTALL.md."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Ndërto APK-në e nënshkruar
        working-directory: android
        env:
          TH_KEYSTORE_BASE64: ${{ secrets.TH_KEYSTORE_BASE64 }}
          TH_KEYSTORE_PASSWORD: ${{ secrets.TH_KEYSTORE_PASSWORD }}
          TH_KEY_PASSWORD: ${{ secrets.TH_KEYSTORE_PASSWORD }}
          TH_KEY_ALIAS: traininghub
        run: |
          export TH_KEYSTORE_PATH="$RUNNER_TEMP/traininghub-release.jks"
          printf '%s' "$TH_KEYSTORE_BASE64" | base64 --decode > "$TH_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
          rm -f "$TH_KEYSTORE_PATH"

      - name: Verifiko nënshkrimin dhe versionin
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee signing.txt
          grep -q "certificate SHA-256 digest: $TH_SIGNING_CERT_SHA256" signing.txt || {
            echo "::error title=Çelës i gabuar::APK-ja nuk është nënshkruar me çelësin e Training Hub."
            exit 1
          }
          "$build_tools/aapt2" dump badging "$apk" | grep "^package:" | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt
          mkdir -p out
          cp "$apk" "out/TrainingHub-$VERSION.apk"
          (cd out && sha256sum "TrainingHub-$VERSION.apk" > "TrainingHub-$VERSION.apk.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TrainingHub-${{ needs.plan.outputs.version }}
          path: out/
          retention-days: 30

      - name: Publiko Release-in
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          notes="Shkarko TrainingHub-$VERSION.apk në telefon dhe hape. Instalimi i parë dhe përditësimet: docs/INSTALL.md."
          if gh release view "$tag" > /dev/null 2>&1; then
            # Release-i u krijua nga faqja e GitHub-it (ajo krijon edhe tag-un): shtohet APK-ja,
            # dhe shënimet vendosen vetëm kur janë bosh.
            gh release upload "$tag" out/* --clobber
            if [ -z "$(gh release view "$tag" --json body --jq .body)" ]; then
              gh release edit "$tag" --notes "$notes"
            fi
          else
            # Tag-u krijohet te commit-i i ndërtuar. Një tag i krijuar me GITHUB_TOKEN nuk e
            # nis përsëri këtë workflow, ndaj APK-ja nuk ndërtohet dy herë.
            gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Vrull $VERSION" --notes "$notes"
          fi

      # Përditësimi brenda app-it (TH-23): APK-ja dhe latest.json te bucket-i privat app-releases i
      # Supabase-it. Pa secret-in SUPABASE_SECRET_KEY hapi vetëm paralajmëron (docs/INSTALL.md).
      - name: Publiko përditësimin brenda app-it
        if: needs.plan.outputs.publish == 'true'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # "Çfarë ka të re": shënimet e shkruara për versionin (docs/whats-new/<versioni>.txt), përndryshe titujt
          # e commit-eve që nga versioni i kaluar.
          if [ -f "docs/whats-new/$VERSION.txt" ]; then
            cp "docs/whats-new/$VERSION.txt" notes.txt
          else
            previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -1 || true)
            git log --format=%s ${previous:+"$previous..HEAD"} > notes.txt
          fi
          node scripts/publish-update.mjs "out/TrainingHub-$VERSION.apk" "$VERSION" notes.txt
