import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Versioni vjen nga package.json, që web-i, APK-ja dhe tag-u i Release-it të jenë një.
// versionCode = major * 10000 + minor * 100 + patch: 0.1.0 -> 100, 1.2.3 -> 10203.
// Android instalon një APK mbi tjetrin vetëm kur versionCode rritet dhe çelësi është i njëjti.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version as String
def versionParts = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!versionParts.matches()) {
    throw new GradleException("Versioni '${appVersion}' te package.json duhet të jetë X.Y.Z")
}
def (major, minor, patch) = (1..3).collect { versionParts.group(it).toInteger() }
if (minor > 99 || patch > 99) {
    throw new GradleException("minor dhe patch duhet të jenë deri në 99 (${appVersion})")
}
def appVersionCode = major * 10000 + minor * 100 + patch

// Çelësi i nënshkrimit vjen nga mjedisi (secret-et e GitHub-it në CI). Pa të, ndërtimi
// release del i panënshkruar dhe nuk instalohet; CI e kontrollon këtë para se të ndërtojë.
def keystorePath = System.getenv('TH_KEYSTORE_PATH')

android {
    namespace = "al.traininghub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "al.traininghub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('TH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TH_KEY_ALIAS')
                keyPassword System.getenv('TH_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
